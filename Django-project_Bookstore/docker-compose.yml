services:
  db:
    image: postgres:15-alpine
    container_name: bookstore_db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: bookstore_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # NGINX Reverse Proxy
  nginx:
    image: nginx:1.25-alpine
    container_name: bookstore_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
    depends_on:
      - web


  web:
    build: .
    container_name: bookstore_web
    command: /app/docker-entrypoint.sh
    volumes:
      - .:/app
      - static_volume:/app/staticfiles  # якщо є прописаний STATIC_ROOT = BASE_DIR / 'staticfiles'
    expose:
      - "8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

# Celery Worker (Фонові таски)
  celery:
      build: .
      container_name: bookstore_celery
      entrypoint: []
      command: celery -A bookstore_project worker --loglevel=info
      volumes:
        - .:/app
      env_file:
        - .env
      depends_on:
        db:
          condition: service_healthy
        redis:
          condition: service_healthy
        web:
          condition: service_started

# Celery Beat (Планувальник періодичних тасок)
  celery_beat:
      build: .
      container_name: bookstore_celery_beat
      entrypoint: []
      command: celery -A bookstore_project beat --loglevel=info
      volumes:
        - .:/app
      env_file:
        - .env
      depends_on:
        db:
          condition: service_healthy
        redis:
          condition: service_healthy
        web:
          condition: service_started

volumes:
  postgres_data:
  static_volume: