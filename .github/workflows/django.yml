name: Django CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Django-project_Bookstore

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: test_bookstore_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ${{ github.workspace }}/Django-project_Bookstore/project_a_bookstore/requirements.txt
          
      - name: Code Linting (Black & Flake8)
        run: |
          black --check .
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run Tests with Coverage
        working-directory: Django-project_Bookstore/project_a_bookstore
        env:
          POSTGRES_DB: bookstore_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          DB_NAME: bookstore_db
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          SECRET_KEY: django-insecure-local-dev-key
          DEBUG: 'True'
          ALLOWED_HOSTS: '127.0.0.1,localhost'
          REDIS_URL: redis://localhost:6379/1
          DJANGO_SETTINGS_MODULE: bookstore_project.settings.development
        run: |
          pytest --ds=bookstore_project.settings.development --cov=. --cov-report=xml:../../coverage.xml

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: Django-project_Bookstore/coverage.xml

  build-and-push-docker:
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./Django-project_Bookstore/project_a_bookstore
          file: ./Django-project_Bookstore/project_a_bookstore/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/bookstore_project:latest
